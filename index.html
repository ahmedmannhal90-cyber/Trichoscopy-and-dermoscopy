<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TrichoscaleDX"/>
<meta name="theme-color" content="#9c1010"/>
<title>TrichoscaleDX</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:linear-gradient(160deg,#c01c1c 0%,#991010 50%,#7a0c0c 100%);min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none}
#root{min-height:100dvh}
@keyframes spin{to{transform:rotate(360deg)}}
input:focus,select:focus{border-color:rgba(255,255,255,0.7)!important;box-shadow:0 0 0 2px rgba(255,255,255,0.15);outline:none}
input::placeholder{color:rgba(255,255,255,0.35)}
option{background:#7a0c0c;color:#fff}
@media(max-width:560px){.fg{grid-template-columns:1fr!important}.ms{grid-template-columns:1fr 1fr!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const{useState,useRef,useCallback}=React;
const CLINIC="Dr. Ahmed Manhal Derma Clinic";
const TODAY=new Date().toLocaleDateString("en-GB").replace(/\//g," / ");

const TRICHO_PROMPT=(p)=>`You are an expert trichoscopy AI working with TrichoscaleDX (FotoFinder® Trichoscale). Analyze the trichoscopic images provided.
STRICT RULE: Report ONLY image-based findings. NO treatment, medication, investigation, or follow-up recommendations.
Patient: Name:${p.name||"N/A"} Age:${p.age||"N/A"} Gender:${p.gender} Duration:${p.duration||"N/A"} Complaint:${p.complaint||"N/A"}
Generate report with these sections:
1. MACROSCOPIC SCALP EVALUATION - hair distribution, thinning, hairline, scalp visibility, color/texture, canities, part-line width
2. QUANTITATIVE TRICHOSCOPY PARAMETERS - Hair Density hairs/cm² (Normal:200-300), HDD% (threshold>20%), Terminal shaft µm (Normal:60-80), Vellus shaft µm (Normal:<30), Anagen:Telogen (Normal:85:15). Flag [ABNORMAL] where needed.
3. TRICHOSCOPY FINDINGS TABLE - PARAMETER | OBSERVED FINDING | CLINICAL SIGNIFICANCE covering: Hair Density, HDD, Follicular Unit Composition, Miniaturization Index, Anagen:Telogen Ratio, Perifollicular Signs, Yellow Dots, Scalp Surface, Hair Shaft Structure
4. TRICHOSCOPIC IMPRESSION - clinical interpretation, diagnosis with grading (Ludwig/Sinclair for FPHL, Hamilton-Norwood for MPHL), contributing factors
5. PRIMARY DIAGNOSIS & KEY PARAMETERS
Use precise medical terminology. Note image quality limitations.`;

const DERMO_PROMPT=(p)=>`You are an expert dermoscopy AI working with TrichoscaleDX (FotoFinder® Dermoscopy AI). Analyze the dermoscopic images provided.
STRICT RULE: Report ONLY image-based findings. NO treatment, medication, excision, referral, or follow-up recommendations.
Patient: Name:${p.name||"N/A"} Age:${p.age||"N/A"} Gender:${p.gender} Duration:${p.duration||"N/A"} Complaint:${p.complaint||"N/A"}
Generate report with these sections:
1. CLINICAL/MACROSCOPIC DESCRIPTION - size, shape, borders, surface, colors, satellite lesions, surrounding skin
2. DERMOSCOPIC CRITERIA EVALUATION - Overall Pattern, Pigmentation, Pigment Network (typical/atypical), Dots & Globules, Streaks/Pseudopods, Regression Structures, Vascular Structures, Blue-White Veil, Milia-Like Cysts, Special Features
3. MELANOMA SCORING - MANDATORY - apply all three:
a) ABCD RULE: Asymmetry(0-2)x1.3 + Border(0-8)x0.1 + Color(1-6)x0.5 + DiffStructure(1-5)x0.5 = TDS (<4.75 benign|4.75-5.45 suspicious|>5.45 highly suspicious)
b) 7-POINT CHECKLIST: Major criteria x2 (atypical network, blue-white veil, atypical vessels) + Minor x1 (irregular streaks, pigmentation, dots/globules, regression) = score (≥3 suspicious)
c) MELANOMA PROBABILITY: Low/Moderate/High with supporting features
4. DIFFERENTIAL DIAGNOSIS - 2-3 diagnoses in order of likelihood with dermoscopic features
5. DERMOSCOPIC IMPRESSION - primary impression and key features
6. SUMMARY - Impression | TDS | 7-Point Score | Melanoma Likelihood
Use ISIC/IDS terminology. Note image quality limitations.`;

const MODES={
  trichoscopy:{id:"trichoscopy",label:"Trichoscopy",icon:"🔬",desc:"Scalp & hair analysis",uploadLabel:"Upload Trichoscopic Images",uploadHint:"Scalp images · JPG · PNG · WEBP",btnLabel:"Generate Trichoscopy Report",reportTitle:"Trichoscopy & Hair Analysis Report",systemLabel:"FotoFinder® Trichoscale",prompt:TRICHO_PROMPT},
  dermoscopy:{id:"dermoscopy",label:"Dermoscopy",icon:"🩺",desc:"Skin lesion analysis",uploadLabel:"Upload Dermoscopic Images",uploadHint:"Skin lesion images · JPG · PNG · WEBP",btnLabel:"Generate Dermoscopy Report",reportTitle:"Dermoscopy & Skin Lesion Analysis Report",systemLabel:"FotoFinder® Dermoscopy AI",prompt:DERMO_PROMPT},
};

const S={
  root:{minHeight:"100vh",background:"linear-gradient(160deg,#c01c1c 0%,#991010 50%,#7a0c0c 100%)",fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",color:"#fff"},
  header:{background:"rgba(0,0,0,0.28)",backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)",borderBottom:"1px solid rgba(255,255,255,0.15)",padding:"0 18px",display:"flex",alignItems:"center",justifyContent:"space-between",height:"58px",position:"sticky",top:0,zIndex:100},
  logoWrap:{display:"flex",alignItems:"center",gap:"10px"},
  logoBox:{background:"#fff",color:"#8c0f0f",fontWeight:"900",fontSize:"0.7rem",padding:"5px 8px",borderRadius:"4px",fontFamily:"Arial Black,Arial,sans-serif",lineHeight:1},
  logoTextWrap:{display:"flex",flexDirection:"column"},
  headerTitle:{fontSize:"0.92rem",fontWeight:"800",color:"#fff",lineHeight:1.1},
  headerSub:{fontSize:"0.57rem",color:"rgba(255,255,255,0.6)",letterSpacing:"1px",textTransform:"uppercase",marginTop:"2px"},
  badge:{background:"rgba(255,255,255,0.15)",color:"#fff",fontSize:"0.54rem",fontWeight:"700",padding:"3px 8px",borderRadius:"2px",letterSpacing:"1.5px",textTransform:"uppercase",border:"1px solid rgba(255,255,255,0.25)"},
  main:{maxWidth:"820px",margin:"0 auto",padding:"18px 14px 60px"},
  modeSwitcher:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"},
  modeBtn:(a)=>({background:a?"rgba(0,0,0,0.35)":"rgba(255,255,255,0.1)",color:"#fff",border:a?"2px solid rgba(255,255,255,0.65)":"2px solid rgba(255,255,255,0.2)",borderRadius:"8px",padding:"12px 13px",cursor:"pointer",textAlign:"left",transition:"all 0.18s",boxShadow:a?"0 4px 16px rgba(0,0,0,0.3)":"none"}),
  modeBtnIcon:{fontSize:"1.3rem",display:"block",marginBottom:"4px"},
  modeBtnLabel:(a)=>({fontSize:"0.86rem",fontWeight:"700",color:"#fff",display:"block"}),
  modeBtnDesc:(a)=>({fontSize:"0.62rem",color:a?"rgba(255,255,255,0.8)":"rgba(255,255,255,0.5)",marginTop:"2px",display:"block"}),
  card:{background:"rgba(0,0,0,0.18)",border:"1px solid rgba(255,255,255,0.13)",borderRadius:"10px",padding:"18px",marginBottom:"13px",backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)"},
  sectionTitle:{fontSize:"0.6rem",fontWeight:"700",color:"#fff",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"13px",paddingBottom:"8px",borderBottom:"1px solid rgba(255,255,255,0.22)",display:"flex",alignItems:"center",gap:"7px"},
  dot:{width:"5px",height:"5px",background:"rgba(255,255,255,0.65)",borderRadius:"50%",flexShrink:0},
  uploadZone:(a)=>({border:`2px dashed ${a?"#fff":"rgba(255,255,255,0.28)"}`,borderRadius:"8px",padding:"32px 14px",textAlign:"center",cursor:"pointer",transition:"all 0.18s",background:a?"rgba(255,255,255,0.13)":"rgba(255,255,255,0.05)"}),
  uploadIcon:{fontSize:"2rem",marginBottom:"7px",display:"block"},
  uploadText:{color:"rgba(255,255,255,0.88)",fontSize:"0.84rem",marginBottom:"4px",fontWeight:"500"},
  uploadHint:{color:"rgba(255,255,255,0.48)",fontSize:"0.68rem"},
  imgGrid:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(90px,1fr))",gap:"7px",marginTop:"12px"},
  imgThumb:{position:"relative",borderRadius:"6px",overflow:"hidden",border:"1px solid rgba(255,255,255,0.2)",aspectRatio:"1"},
  imgEl:{width:"100%",height:"100%",objectFit:"cover",display:"block"},
  removeBtn:{position:"absolute",top:"4px",right:"4px",background:"rgba(0,0,0,0.65)",border:"none",color:"#fff",borderRadius:"50%",width:"19px",height:"19px",cursor:"pointer",fontSize:"9px",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700"},
  formGroup:{display:"flex",flexDirection:"column",gap:"4px"},
  label:{fontSize:"0.6rem",color:"rgba(255,255,255,0.62)",letterSpacing:"0.8px",textTransform:"uppercase",fontWeight:"600"},
  input:{background:"rgba(0,0,0,0.22)",border:"1px solid rgba(255,255,255,0.17)",borderRadius:"6px",padding:"9px 10px",color:"#fff",fontSize:"0.84rem",fontFamily:"inherit",outline:"none",width:"100%"},
  select:{background:"rgba(0,0,0,0.22)",border:"1px solid rgba(255,255,255,0.17)",borderRadius:"6px",padding:"9px 10px",color:"#fff",fontSize:"0.84rem",fontFamily:"inherit",outline:"none",width:"100%"},
  btn:(d)=>({background:d?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.3)",color:d?"rgba(255,255,255,0.35)":"#fff",border:d?"1px solid rgba(255,255,255,0.12)":"2px solid rgba(255,255,255,0.52)",borderRadius:"8px",padding:"13px",fontSize:"0.8rem",fontWeight:"700",letterSpacing:"1.8px",textTransform:"uppercase",cursor:d?"not-allowed":"pointer",width:"100%",transition:"all 0.2s"}),
  spinner:{display:"inline-block",width:"13px",height:"13px",border:"2px solid rgba(255,255,255,0.25)",borderTop:"2px solid #fff",borderRadius:"50%",animation:"spin 0.7s linear infinite",marginRight:"8px",verticalAlign:"middle"},
  errorBox:{background:"rgba(0,0,0,0.25)",border:"1px solid rgba(255,255,255,0.22)",borderLeft:"4px solid #fff",borderRadius:"6px",padding:"10px 13px",color:"#fff",fontSize:"0.8rem",marginTop:"11px",display:"flex",gap:"7px"},
  reportWrap:{background:"#fff",borderRadius:"10px",overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.45)",marginTop:"20px"},
  rHeader:{background:"#7a0c0c",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"3px solid #c01c1c"},
  rHeaderLeft:{display:"flex",alignItems:"center",gap:"9px"},
  rLogoBox:{background:"#fff",color:"#8c0f0f",fontWeight:"900",fontSize:"0.58rem",padding:"4px 6px",borderRadius:"3px",fontFamily:"Arial Black,sans-serif",lineHeight:1},
  rClinic:{fontSize:"0.84rem",fontWeight:"700",color:"#fff"},
  rSubClinic:{fontSize:"0.56rem",color:"rgba(255,255,255,0.5)",letterSpacing:"1px",textTransform:"uppercase",marginTop:"2px"},
  rHeaderRight:{textAlign:"right",fontSize:"0.6rem",color:"rgba(255,255,255,0.6)"},
  rBadge:{background:"#c01c1c",color:"#fff",fontSize:"0.52rem",fontWeight:"700",padding:"2px 6px",borderRadius:"2px",letterSpacing:"1px",display:"inline-block",marginBottom:"3px"},
  rBody:{padding:"18px",lineHeight:"1.65",fontFamily:"'Helvetica Neue',Arial,sans-serif",fontSize:"0.84rem",color:"#1a1a1a"},
  rSectionHead:{background:"#7a0c0c",color:"#fff",fontSize:"0.58rem",fontWeight:"700",letterSpacing:"2px",textTransform:"uppercase",padding:"5px 11px",marginTop:"16px",marginBottom:"7px",borderLeft:"3px solid #ff6b6b",display:"flex",alignItems:"center",gap:"5px"},
  table:{width:"100%",borderCollapse:"collapse",marginTop:"4px",fontSize:"0.8rem"},
  th:{background:"#f9eaea",padding:"5px 9px",textAlign:"left",fontSize:"0.58rem",fontWeight:"700",letterSpacing:"1px",textTransform:"uppercase",color:"#8c0f0f",borderBottom:"2px solid #e8c5c5"},
  td:{padding:"6px 9px",borderBottom:"1px solid #f0dada",color:"#2a2a2a",verticalAlign:"top"},
  tdLabel:{fontWeight:"700",color:"#7a0c0c",whiteSpace:"nowrap",width:"120px"},
  noteBox:{background:"#fff5f5",border:"1px solid #e8c5c5",borderLeft:"4px solid #c01c1c",borderRadius:"4px",padding:"10px 13px",marginTop:"14px",fontSize:"0.72rem",color:"#666"},
  rFooter:{background:"#7a0c0c",padding:"8px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:"0.56rem",color:"rgba(255,255,255,0.42)",borderTop:"2px solid #c01c1c",flexWrap:"wrap",gap:"3px"},
  copyBtn:{background:"rgba(255,255,255,0.12)",color:"#fff",border:"1.5px solid rgba(255,255,255,0.38)",borderRadius:"6px",padding:"8px 16px",fontSize:"0.66rem",fontWeight:"700",letterSpacing:"1.5px",textTransform:"uppercase",cursor:"pointer",marginTop:"9px"},
};

function ReportDisplay({report,patient,mode}){
  const ref=useRef();
  const[copied,setCopied]=useState(false);
  const cfg=MODES[mode];
  const handleCopy=()=>{navigator.clipboard.writeText(ref.current.innerText);setCopied(true);setTimeout(()=>setCopied(false),2000);};
  return(
    <div>
      <div style={S.reportWrap} ref={ref}>
        <div style={S.rHeader}>
          <div style={S.rHeaderLeft}>
            <div style={S.rLogoBox}>TrichoscaleDX</div>
            <div><div style={S.rClinic}>{CLINIC}</div><div style={S.rSubClinic}>{cfg.reportTitle}</div></div>
          </div>
          <div style={S.rHeaderRight}><div style={S.rBadge}>{cfg.systemLabel}</div><div>Date: {TODAY}</div></div>
        </div>
        <div style={S.rBody}>
          <div style={S.rSectionHead}><span style={{color:"#ff6b6b"}}>■</span> Patient Information</div>
          <table style={S.table}><tbody>
            <tr><td style={{...S.td,...S.tdLabel}}>Patient Name</td><td style={S.td}>{patient.name||"—"}</td><td style={{...S.td,...S.tdLabel}}>Date of Birth</td><td style={S.td}>{patient.dob||"—"}</td></tr>
            <tr><td style={{...S.td,...S.tdLabel}}>Age</td><td style={S.td}>{patient.age||"—"}</td><td style={{...S.td,...S.tdLabel}}>Gender</td><td style={S.td}>{patient.gender||"—"}</td></tr>
            <tr><td style={{...S.td,...S.tdLabel}}>Duration</td><td style={S.td}>{patient.duration||"—"}</td><td style={{...S.td,...S.tdLabel}}>Complaint</td><td style={S.td}>{patient.complaint||"—"}</td></tr>
          </tbody></table>
          <div style={S.rSectionHead}><span style={{color:"#ff6b6b"}}>■</span> {mode==="trichoscopy"?"AI Trichoscopic Analysis":"AI Dermoscopic Analysis"}</div>
          <div style={{whiteSpace:"pre-wrap",color:"#2a2a2a",lineHeight:"1.75",fontSize:"0.84rem"}}>{report}</div>
          <div style={S.noteBox}>⚕️ <strong>Clinical Notice:</strong> AI-assisted report for qualified medical professionals only. Not a standalone diagnosis. Correlate with clinical examination and patient history.</div>
        </div>
        <div style={S.rFooter}><div>TrichoscaleDX · {CLINIC}</div><div>Setting the Pace in Skin Imaging Worldwide</div></div>
      </div>
      <button style={S.copyBtn} onClick={handleCopy}>{copied?"✓ Copied!":"📋 Copy Report"}</button>
    </div>
  );
}

function App(){
  const[mode,setMode]=useState("trichoscopy");
  const[images,setImages]=useState([]);
  const[dragging,setDragging]=useState(false);
  const[patient,setPatient]=useState({name:"",dob:"",age:"",gender:"Female",duration:"",complaint:""});
  const[loading,setLoading]=useState(false);
  const[report,setReport]=useState("");
  const[error,setError]=useState("");
  const fileRef=useRef();
  const cfg=MODES[mode];
  const switchMode=(m)=>{setMode(m);setImages([]);setReport("");setError("");};
  const addFiles=useCallback(async(files)=>{
    const arr=[];
    for(const f of files){
      if(!f.type.startsWith("image/"))continue;
      const url=URL.createObjectURL(f);
      const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(f);});
      arr.push({url,base64:b64,type:f.type});
    }
    setImages(p=>[...p,...arr]);
  },[]);
  const handleDrop=e=>{e.preventDefault();setDragging(false);addFiles(Array.from(e.dataTransfer.files));};
  const handleGenerate=async()=>{
    if(!images.length){setError("Please upload at least one image.");return;}
    setError("");setLoading(true);setReport("");
    try{
      const content=[...images.map(img=>({type:"image",source:{type:"base64",media_type:img.type,data:img.base64}})),{type:"text",text:cfg.prompt(patient)}];
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content}]})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      setReport(data.content?.map(b=>b.text||"").join("\n")||"No report generated.");
    }catch(e){setError("Error: "+e.message);}
    finally{setLoading(false);}
  };
  const dis=loading||!images.length;
  return(
    <div style={S.root}>
      <div style={S.header}>
        <div style={S.logoWrap}>
          <div style={S.logoBox}>TrichoscaleDX</div>
          <div style={S.logoTextWrap}>
            <div style={S.headerTitle}>TrichoscaleDX</div>
            <div style={S.headerSub}>Advanced Dermoscopic Analysis</div>
          </div>
        </div>
        <span style={S.badge}>AI-Powered</span>
      </div>
      <div style={S.main}>
        <div style={S.modeSwitcher} className="ms">
          {Object.values(MODES).map(m=>(
            <button key={m.id} style={S.modeBtn(mode===m.id)} onClick={()=>switchMode(m.id)}>
              <span style={S.modeBtnIcon}>{m.icon}</span>
              <span style={S.modeBtnLabel(mode===m.id)}>{m.label}</span>
              <span style={S.modeBtnDesc(mode===m.id)}>{m.desc}</span>
            </button>
          ))}
        </div>
        <div style={S.card}>
          <div style={S.sectionTitle}><span style={S.dot}/>{cfg.uploadLabel}</div>
          <div style={S.uploadZone(dragging)} onClick={()=>fileRef.current.click()} onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop}>
            <span style={S.uploadIcon}>{cfg.icon}</span>
            <div style={S.uploadText}>Tap to upload images</div>
            <div style={S.uploadHint}>{cfg.uploadHint}</div>
            <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>addFiles(Array.from(e.target.files))}/>
          </div>
          {images.length>0&&<div style={S.imgGrid}>{images.map((img,i)=><div key={i} style={S.imgThumb}><img src={img.url} alt="" style={S.imgEl}/><button style={S.removeBtn} onClick={()=>setImages(p=>p.filter((_,j)=>j!==i))}>✕</button></div>)}</div>}
        </div>
        <div style={S.card}>
          <div style={S.sectionTitle}><span style={S.dot}/>Patient Information</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"11px"}} className="fg">
            {[{k:"name",l:"Patient Name",ph:"Full name"},{k:"dob",l:"Date of Birth",ph:"DD/MM/YYYY"},{k:"age",l:"Age",ph:"e.g. 35 Years"},{k:"duration",l:"Duration",ph:"e.g. 3 Months"}].map(({k,l,ph})=>(
              <div key={k} style={S.formGroup}><label style={S.label}>{l}</label><input style={S.input} value={patient[k]} placeholder={ph} onChange={e=>setPatient(p=>({...p,[k]:e.target.value}))}/></div>
            ))}
            <div style={S.formGroup}><label style={S.label}>Gender</label><select style={S.select} value={patient.gender} onChange={e=>setPatient(p=>({...p,gender:e.target.value}))}><option>Female</option><option>Male</option><option>Other</option></select></div>
            <div style={S.formGroup}><label style={S.label}>{mode==="dermoscopy"?"Lesion/Complaint":"Chief Complaint"}</label><input style={S.input} value={patient.complaint} placeholder={mode==="dermoscopy"?"e.g. Changing mole":"e.g. Hair thinning"} onChange={e=>setPatient(p=>({...p,complaint:e.target.value}))}/></div>
          </div>
        </div>
        <button style={S.btn(dis)} onClick={handleGenerate} disabled={dis}>
          {loading&&<span style={S.spinner}/>}{loading?"Analyzing Images…":cfg.btnLabel}
        </button>
        {error&&<div style={S.errorBox}><span>⚠️</span><span>{error}</span></div>}
        {report&&<ReportDisplay report={report} patient={patient} mode={mode}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
