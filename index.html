<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA / iPhone Home Screen ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrichoscaleDX" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#9c1010" />

    <!-- App icon shown on iPhone home screen -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iPhone splash screens (portrait) -->
    <!-- iPhone 16 Pro Max -->
    <link rel="apple-touch-startup-image"
      href="/splash/splash-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 16 Pro -->
    <link rel="apple-touch-startup-image"
      href="/splash/splash-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 15 Plus / 14 Pro Max -->
    <link rel="apple-touch-startup-image"
      href="/splash/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 15 / 14 Pro -->
    <link rel="apple-touch-startup-image"
      href="/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14 / 13 / 12 -->
    <link rel="apple-touch-startup-image"
      href="/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone SE 3rd gen / 8 -->
    <link rel="apple-touch-startup-image"
      href="/splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TrichoscaleDX</title>

    <style>
      /* Prevent iOS rubber-band scroll & fill safe areas */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0;
        overscroll-behavior: none;
        background: #9c1010;
        /* respect iPhone notch / home indicator */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
